name: Android Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version matches tag when tag-triggered
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName "\(.*\)"/\1/')
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          echo "Version from build.gradle: $VERSION_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: build.gradle=$VERSION_NAME tag=$TAG_VERSION"
            exit 1
          fi

      - name: Check release signing secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "::error::Missing repository secret KEYSTORE"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing repository secret KEY_ALIAS"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing repository secret KEYSTORE_PASSWORD"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing repository secret KEY_PASSWORD"; exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace --console=plain

      - name: Sign APK with persistent release key
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Verify signed APK and calculate checksum
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-signed.apk' | head -n 1)
          test -n "$APK" || (echo "::error::Signed APK not found"; exit 1)
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          mkdir -p release_artifacts
          cp "$APK" release_artifacts/WASEEM-MESSAGE-SENDER-PRO.apk
          cp app/build/outputs/apk/release/SHA256SUMS.txt release_artifacts/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-signed-release
          path: release_artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
