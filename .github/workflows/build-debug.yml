name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
          echo ${PIPESTATUS[0]} > gradle-exit-code.txt

      - name: Publish Gradle error for diagnosis
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace")
          lines = text.splitlines()
          tail = "\\n".join(lines[-120:])
          body = "Automated Gradle build failure for " + "${{ github.sha }}" + "\\n\\n```text\\n" + tail[:12000] + "\\n```"
          Path("/tmp/issue.json").write_text(json.dumps({"title":"Build diagnostic ${{ github.sha }}","body":body}))
          PY
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/issues --data-binary @/tmp/issue.json

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-build-log
          path: |
            gradle-build.log
            gradle-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
