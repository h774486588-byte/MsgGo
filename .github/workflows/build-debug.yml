name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
          echo ${PIPESTATUS[0]} > gradle-exit-code.txt

      - name: Publish Gradle error for diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          p=Path('gradle-build.log')
          text=p.read_text(errors='replace') if p.exists() else 'NO LOG'
          text=text[-30000:]
          api='https://api.github.com/repos/${{ github.repository }}/contents/.build-diagnostics/gradle-build.log'
          payload={'message':'Capture Gradle build diagnostic','content':base64.b64encode(text.encode()).decode(),'branch':'master'}
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method='PUT',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          try:
              print(urllib.request.urlopen(req).read().decode())
          except urllib.error.HTTPError as e:
              print(e.read().decode())
          PY
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-build-log
          path: |
            gradle-build.log
            gradle-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
