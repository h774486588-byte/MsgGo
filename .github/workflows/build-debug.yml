name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
          echo ${PIPESTATUS[0]} > gradle-exit-code.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-build-log
          path: |
            gradle-build.log
            gradle-exit-code.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MESSAGE-SENDER-PRO-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
