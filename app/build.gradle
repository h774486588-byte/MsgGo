apply plugin: 'com.android.application'

android {
    namespace "top.yztz.msggo"
    compileSdk = 35
    defaultConfig {
        applicationId "top.yztz.msggo"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 26000317
        versionName "3.17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            // Build an installable APK for the final distribution artifact.
            // This uses the Android debug keystore available on the CI runner.
            // A user-owned release keystore should replace this before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    androidResources {
        noCompress 'ttf', 'otf'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def abi = filters.find { it.filterType == 'ABI' }?.identifier ?: "universal"
            def typeSuffix = variant.buildType.name == 'release' ? "" : "-unsigned"
            def productName = variant.buildType.name == 'release' ? "WASEEM-MESSAGE-SENDER-PRO" : "MsgGo"
            outputFileName = "${productName}-${variant.versionName}-${abi}${typeSuffix}.apk"
        }
    }
}

repositories {
    maven { url 'https://www.jitpack.io' }
}

dependencies {
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation 'com.github.houbb:sensitive-word:0.29.4'
}
